<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>System Lock Virus</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: red;
      font-family: 'Courier New', monospace;
      height: 100%;
      overflow: hidden;
      pointer-events: none; /* Disable mouse clicks */
      user-select: none;
    }

    #lockscreen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      z-index: 9999;
      pointer-events: auto;
    }

    .box {
      border: 3px solid red;
      padding: 30px;
      background-color: #000000cc;
      border-radius: 10px;
      box-shadow: 0 0 30px red;
      width: 70%;
    }

    h1 {
      font-size: 32px;
      animation: flicker 1s infinite;
    }

    p {
      font-size: 18px;
    }

    .disabled-btn {
      background-color: #222;
      color: red;
      border: 2px solid red;
      padding: 10px 20px;
      font-size: 16px;
      cursor: not-allowed;
      margin: 10px;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @media (max-width: 768px) {
      body {
        display: none !important;
      }
      html::before {
        content: "❌ This simulation is not supported on mobile devices.";
        color: red;
        font-size: 24px;
        text-align: center;
        display: block;
        margin-top: 100px;
      }
    }
  </style>
</head>
<body>

  <div id="lockscreen">
    <div class="box">
      <h1>💥 SYSTEM ERROR: VIRUS DETECTED 💥</h1>
      <p id="countdown">Files will be deleted in <span id="time">10</span> seconds...</p>
      <p>DO NOT try to close or switch. Press ESC to exit this lock.</p>
      <button class="disabled-btn" disabled>OK</button>
      <button class="disabled-btn" disabled>Cancel</button>
    </div>
  </div>

  <audio id="beep" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>

  <script>
    let timeLeft = 10;
    const countdownSpan = document.getElementById('time');
    const beep = document.getElementById('beep');

    const countdownInterval = setInterval(() => {
      timeLeft--;
      countdownSpan.textContent = timeLeft;
      beep.play();

      if (timeLeft <= 0) {
        clearInterval(countdownInterval);
        alert("⚠️ Files are being deleted... Press ESC to stop!");
      }
    }, 1000);

    // Disable right-click
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Block most keyboard input
    document.addEventListener('keydown', function (e) {
      const blocked = ['F12', 'F11', 'Tab', 'Alt', 'Control', 'Meta', 'Shift'];
      if (blocked.includes(e.key) || (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
      }

      // Allow ESC to exit
      if (e.key === "Escape") {
        document.getElementById('lockscreen').style.display = 'none';
        document.body.style.pointerEvents = 'auto';
        document.removeEventListener('keydown', arguments.callee);
        alert("✅ Virus exited. You're safe now.");
      }
    });

    // Block back/forward nav
    history.pushState(null, null, location.href);
    window.onpopstate = () => {
      history.pushState(null, null, location.href);
    };

    // Stop new tabs via Ctrl+T / Ctrl+N
    window.open = () => null;

    // Tab switch warning (optional)
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        alert("⚠️ Don't try to switch tabs! Virus is active.");
      }
    });
  </script>
</body>
</html>
